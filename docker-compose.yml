version: '3.8'

services:
  # React Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile # Points to the frontend Dockerfile at project root
    # ports:
    #   - "8080:80" # Maps localhost:8080 to container port 80 (Nginx)
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: "npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"

  # Node.js Application
  backend:
    build:
      context: ./backend
      dockerfile: backend.Dockerfile
    tty: true
    stdin_open: true
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    command: "npm run dev -- --host 0.0.0.0 --port 3000"
  

  # Database (PostgreSQL)
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # PgAdmin Interface
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data: